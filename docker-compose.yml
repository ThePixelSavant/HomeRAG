services:
  # Vector store for the OPEN tier only. Sensitive data never reaches it --
  # a vector cannot be encrypted and stay searchable, and inversion recovers
  # most of the source text from one.
  #
  # Pinned by digest: snapshot restore requires a matching minor version, so a
  # silent `latest` bump between taking a backup and restoring it breaks the
  # migration. Rollback digest: (record the previous digest here on upgrade)
  qdrant:
    image: qdrant/qdrant@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: qdrant
    restart: unless-stopped
    # Non-root. Third-party image, so this is set here rather than baked in.
    # Verified: it serves reads and writes as 1000:1000 and the storage tree
    # comes out owned by the host user instead of root.
    user: "${RAG_UID:-1000}:${RAG_GID:-1000}"
    volumes:
      - ./data/qdrant:/qdrant/storage
      # Snapshots were landing in the container's own layer, where a
      # `compose up` that recreates the container silently discards them --
      # which is awkward for the one feature whose entire point is surviving a
      # move to different hardware. They belong in the rsync-able tree.
      - ./data/qdrant-snapshots:/qdrant/snapshots
    environment:
      # Set once Qdrant is reachable off the local bridge. Unauthenticated is
      # survivable on a private bridge, not on a LAN.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:-}
    healthcheck:
      # The image ships no curl, wget, nc or python3 -- only bash. The previous
      # `curl -f .../health` could never pass, which is why mcp-server sat in
      # Created for six weeks. 127.0.0.1 rather than localhost: the latter can
      # resolve ::1 first and fail against a v4-only listener.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - llm-net
    logging:
      driver: journald
      options:
        tag: "qdrant"

  # Open-tier MCP server. Carries no crypto, holds no key, and has NO vault
  # mount -- it cannot read vault.db even if compromised.
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        RAG_UID: ${RAG_UID:-1000}
        RAG_GID: ${RAG_GID:-1000}
    container_name: mcp-server
    restart: unless-stopped
    user: "${RAG_UID:-1000}:${RAG_GID:-1000}"
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      # Read-only key: this service never writes.
      QDRANT_API_KEY: ${QDRANT_READ_ONLY_API_KEY:-}
      STATE_DB_PATH: /data/state/rag.db
      SOURCES_FILE: /app/sources.yaml
    volumes:
      # state/ only. Deliberately NO vault mount: this service must not be able
      # to open vault.db under any circumstances.
      - ./data/state:/data/state:ro
    depends_on:
      qdrant:
        condition: service_healthy
    # This service parses untrusted open-tier documents, which makes it the most
    # likely thing on the bridge to be compromised. NET_RAW is in Docker's
    # default set and is what ARP spoofing needs; nothing here sends raw packets.
    cap_drop:
      - NET_RAW
    networks:
      - llm-net
    logging:
      driver: journald
      options:
        tag: "mcp-server"

  # Vault MCP server. Separate process so the in-memory key never shares an
  # address space with the untrusted open-tier query surface.
  mcp-vault:
    build:
      context: .
      dockerfile: Dockerfile.vault
    container_name: mcp-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VAULT_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      VAULT_DB_PATH: /data/vault/vault.db
      VAULT_BLOBS_PATH: /data/vault/blobs
      STATE_DB_PATH: /data/state/rag.db
      DATA_ROOT: /data
    volumes:
      - ./data/vault:/data/vault
      - ./data/state:/data/state:ro
    # Deliberately NOT on llm-net. vault-net carries only this container and
    # open-webui, so mcp-server is not in the same broadcast domain and cannot
    # ARP-spoof the hop the identity assertion travels on. This service makes no
    # outbound network calls, and vaultctl reaches it over control.sock, so
    # being unreachable from everything else costs nothing.
    networks:
      - vault-net
    logging:
      driver: journald
      options:
        tag: "mcp-vault"

  # One-shot worker, driven by the Makefile. `profiles` keeps `make up` from
  # starting it; it runs per invocation and returns its memory afterwards,
  # rather than idling with a resident ONNX model.
  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.ingest
      args:
        RAG_UID: ${RAG_UID:-1000}
        RAG_GID: ${RAG_GID:-1000}
    image: rag-ingestion-worker
    # Must match the owner of ./data, or every write fails. This is also what
    # stops `make add` leaving root-owned documents in the inbox.
    user: "${RAG_UID:-1000}:${RAG_GID:-1000}"
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      LLAMA_URL: ${LLAMA_URL:-http://llama-server:8080}
      DATA_ROOT: /data
      INBOX_PATH: /data/inbox
      ARCHIVE_PATH: /data/archive
      QUARANTINE_PATH: /data/quarantine
      VAULT_BLOBS_PATH: /data/vault/blobs
      STATE_DB_PATH: /data/state/rag.db
      VAULT_DB_PATH: /data/vault/vault.db
    volumes:
      - ./data:/data
      - ./sources.yaml:/app/sources.yaml:ro
      - ${LOCAL_DOCS_PATH:-/dev/null}:/docs:ro
      - ${CLAUDE_PROJECTS_PATH:-/dev/null}:/transcripts:ro
    # Same reasoning as mcp-server: this one opens untrusted PDFs and
    # transcripts. It needs outbound TCP to qdrant and llama-server, which
    # NET_RAW has nothing to do with.
    cap_drop:
      - NET_RAW
    networks:
      - llm-net
    logging:
      driver: journald
      options:
        tag: "ingestion-worker"

networks:
  llm-net:
    external: true   # Defined in ~/Dev/LLM/docker-compose.yml; start that stack first
  vault-net:
    external: true   # Same -- the isolated open-webui <-> mcp-vault bridge

# No named volumes. Everything lives under ./data as bind mounts so the whole
# stack is one rsync-able directory -- named volumes are root-owned and need
# sudo even to inspect, which makes the eventual server move needlessly hard.
