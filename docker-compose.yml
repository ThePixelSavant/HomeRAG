services:
  # Vector store for the OPEN tier only. Sensitive data never reaches it --
  # a vector cannot be encrypted and stay searchable, and inversion recovers
  # most of the source text from one.
  #
  # Docker Hardened Image (ADR-034): Qdrant and nothing else -- no shell, no
  # package manager, three entries in /usr/bin against the official image's
  # 341. Pulling needs `docker login dhi.io` (a free Docker Hub account).
  #
  # Pinned by digest: snapshot restore requires a matching minor version, so a
  # silent `latest` bump between taking a backup and restoring it breaks the
  # migration. Current: dhi.io/qdrant 1.20.0-debian13.
  # Rollback to the official image, same version (verified to read the same
  # storage and restore the same snapshots), which needs the healthcheck back:
  #   qdrant/qdrant@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
  # Before that, v1.19.0: sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
  # (storage backup from before the 1.20 bump is
  # data/qdrant-backup-2026-11-05-pre-1.20.tar.gz).
  qdrant:
    image: dhi.io/qdrant@sha256:a7f3687ad9690253dc91c81897712989d983d4bb324cbe96b86b31ea20fbfb73
    container_name: qdrant
    restart: unless-stopped
    # The image runs as 65532; this keeps the storage tree owned by the host
    # user, like every other service. Verified: it serves reads, writes and
    # snapshots as 1000:1000.
    user: "${RAG_UID:-1000}:${RAG_GID:-1000}"
    # It listens on high ports and writes only its own bind mounts, so it
    # needs no capabilities and no writable root filesystem. (It logs one WARN
    # at startup: it cannot write `.qdrant-initialized`, a Kubernetes readiness
    # marker nothing here reads.)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - ./data/qdrant:/qdrant/storage
      # Snapshots were landing in the container's own layer, where a
      # `compose up` that recreates the container silently discards them --
      # which is awkward for the one feature whose entire point is surviving a
      # move to different hardware. They belong in the rsync-able tree.
      - ./data/qdrant-snapshots:/qdrant/snapshots
    environment:
      # Required. llm-net is shared with open-webui and llama-server, and an
      # unauthenticated Qdrant let any of them read every open-tier chunk
      # without going through mcp-server's client tokens (ADR-033). The worker
      # holds the read-write key; mcp-server and rag-admin the read-only one.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env (openssl rand -hex 32)}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?set QDRANT_READ_ONLY_API_KEY in .env (openssl rand -hex 32)}
      # On by default: an hourly report to telemetry.qdrant.io. Nothing in this
      # stack should phone home, and the attempts logged an ERROR every hour.
      QDRANT__TELEMETRY_DISABLED: "true"
    # No healthcheck: the image has nothing to run one with, and adding a
    # shell back would undo the point of it. The old check only proved the
    # port accepted a TCP connection. mcp-server waits for Qdrant itself
    # (check_collection(wait_seconds=60)), so dependents use service_started.
    networks:
      - llm-net
    logging:
      driver: journald
      options:
        tag: "qdrant"

  # Open-tier MCP server. Carries no crypto, holds no key, and has NO vault
  # mount -- it cannot read vault.db even if compromised.
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        RAG_UID: ${RAG_UID:-1000}
        RAG_GID: ${RAG_GID:-1000}
    container_name: mcp-server
    restart: unless-stopped
    user: "${RAG_UID:-1000}:${RAG_GID:-1000}"
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    # NOT env_file: .env. This is the server models talk to, and .env holds
    # secrets it has no use for (the vault's JWT secret lives in .env.vault
    # now, but REPORT_TOKEN and whatever is added next would still arrive).
    # Only what app.main and its imports read; tests/test_compose.py holds it.
    environment:
      QDRANT_URL: http://qdrant:6333
      # Read-only key: this service never writes.
      QDRANT_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?set QDRANT_READ_ONLY_API_KEY in .env (openssl rand -hex 32)}
      COLLECTION_NAME: ${COLLECTION_NAME:-docs}
      # The fingerprint check refuses to start on a mismatch, so a value
      # dropped here fails loudly rather than embedding queries wrongly.
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      EMBED_DIM: ${EMBED_DIM:-384}
      EMBED_THREADS_QUERY: ${EMBED_THREADS_QUERY:-4}
      FASTEMBED_CACHE_PATH: ${FASTEMBED_CACHE_PATH:-/models}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-400}
      STATE_DB_PATH: /data/state/rag.db
      SOURCES_FILE: /app/sources.yaml
      MCP_CLIENT_TOKENS: ${MCP_CLIENT_TOKENS:-}
    volumes:
      # state/ only. Deliberately NO vault mount: this service must not be able
      # to open vault.db under any circumstances.
      - ./data/state:/data/state:ro
    depends_on:
      qdrant:
        condition: service_started
    # This service parses untrusted open-tier documents, which makes it the most
    # likely thing on the bridge to be compromised. NET_RAW is in Docker's
    # default set and is what ARP spoofing needs; nothing here sends raw packets.
    cap_drop:
      - NET_RAW
    networks:
      - llm-net
    logging:
      driver: journald
      options:
        tag: "mcp-server"

  # Read-only admin dashboard, opened in a browser at http://127.0.0.1:8090
  # (ADR-031). Not inside Open WebUI: a pipe there needs ENABLE_FUNCTIONS, and
  # ~/Dev/LLM keeps that off. Same image as mcp-server, different command.
  # Kept out of mcp-server so the model-facing server is unchanged and this
  # gets only what it needs: state read-only, Qdrant's read-only key, llm-net
  # (to reach Qdrant), no capabilities.
  rag-admin:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        RAG_UID: ${RAG_UID:-1000}
        RAG_GID: ${RAG_GID:-1000}
    container_name: rag-admin
    restart: unless-stopped
    user: "${RAG_UID:-1000}:${RAG_GID:-1000}"
    command: ["python", "-m", "app.admin_server"]
    # Host loopback only. The app also refuses any Host header but
    # 127.0.0.1/localhost, and every page needs REPORT_TOKEN.
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8090}:8080"
    # NOT env_file: .env, which would hand this container the vault JWT secret
    # it has no use for. Only what the report reads.
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?set QDRANT_READ_ONLY_API_KEY in .env (openssl rand -hex 32)}
      COLLECTION_NAME: ${COLLECTION_NAME:-docs}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      EMBED_DIM: ${EMBED_DIM:-384}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-400}
      STATE_DB_PATH: /data/state/rag.db
      REPORT_TOKEN: ${REPORT_TOKEN:-}
    volumes:
      - ./data/state:/data/state:ro
    depends_on:
      qdrant:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Never vault-net: see mcp-vault below.
    networks:
      - llm-net
    logging:
      driver: journald
      options:
        tag: "rag-admin"

  # Vault MCP server. Separate process so the in-memory key never shares an
  # address space with the untrusted open-tier query surface.
  mcp-vault:
    build:
      context: .
      dockerfile: Dockerfile.vault
      args:
        RAG_UID: ${RAG_UID:-1000}
        RAG_GID: ${RAG_GID:-1000}
    container_name: mcp-vault
    restart: unless-stopped
    user: "${RAG_UID:-1000}:${RAG_GID:-1000}"
    # NO `ports:`. Nothing used the published 127.0.0.1:8001 (Open WebUI
    # connects over vault-net, vaultctl over control.sock), and vault-net is
    # `internal`, which refuses to publish ports anyway. VAULT_PORT in .env is
    # still the port the server listens on inside the container.
    #
    # This does NOT hide the vault from the host: the host has an address on
    # every bridge and can still connect to mcp-vault's vault-net IP directly.
    # The network boundary is container-to-container. On the host the boundary
    # is the docker group (docker exec reaches vaultctl) and .env.vault (mode
    # 600, holds the JWT secret) -- anything with those needs no network path.
    #
    # Unprivileged uid, high port, no raw sockets: it needs no capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # .env.vault holds the identity secret and the vault's allowlist and
    # TTLs. Only this service reads it: the worker and mcp-server, the two
    # that handle untrusted input, never see VAULT_JWT_SECRET.
    env_file:
      - .env
      - .env.vault
    environment:
      VAULT_DB_PATH: /data/vault/vault.db
      VAULT_BLOBS_PATH: /data/vault/blobs
      VAULT_CONTROL_SOCKET: /run/vault/control.sock
      STATE_DB_PATH: /data/state/rag.db
      DATA_ROOT: /data
    volumes:
      - ./data/vault:/data/vault
      - ./data/state:/data/state:ro
    # The control socket lives here, in memory, private to this container --
    # NOT on ./data/vault. The ingestion worker runs as the same uid and mounts
    # that directory; a socket there would be reachable from the process that
    # parses untrusted files. `make unlock` and the vault CLI run in this
    # container via `docker exec`, so they are the only callers.
    tmpfs:
      - /run/vault:mode=0700,uid=${RAG_UID:-1000},gid=${RAG_GID:-1000}
    # Deliberately NOT on llm-net. vault-net carries only this container and
    # open-webui, so mcp-server is not in the same broadcast domain and cannot
    # ARP-spoof the hop the identity assertion travels on. This service makes no
    # outbound network calls, and vaultctl reaches it over control.sock, so
    # being unreachable from everything else costs nothing.
    #
    # Nothing else may join vault-net or use `network_mode: container:mcp-vault`:
    # every tool server holds a valid identity assertion each turn, so
    # reachability is the boundary. `make up` runs check-vault-net.sh.
    networks:
      - vault-net
    logging:
      driver: journald
      options:
        tag: "mcp-vault"

  # One-shot worker, driven by the Makefile. `profiles` keeps `make up` from
  # starting it; it runs per invocation and returns its memory afterwards,
  # rather than idling with a resident ONNX model.
  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.ingest
      args:
        RAG_UID: ${RAG_UID:-1000}
        RAG_GID: ${RAG_GID:-1000}
    image: rag-ingestion-worker
    # Must match the owner of ./data, or every write fails. This is also what
    # stops `make add` leaving root-owned documents in the inbox.
    user: "${RAG_UID:-1000}:${RAG_GID:-1000}"
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      # Read-write: the only service that writes the index. Also in .env, but
      # stated here so a missing key stops the run instead of a 401 mid-sync.
      QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env (openssl rand -hex 32)}
      LLAMA_URL: ${LLAMA_URL:-http://llama-server:8080}
      DATA_ROOT: /data
      INBOX_PATH: /data/inbox
      ARCHIVE_PATH: /data/archive
      QUARANTINE_PATH: /data/quarantine
      VAULT_BLOBS_PATH: /data/vault/blobs
      STATE_DB_PATH: /data/state/rag.db
      VAULT_DB_PATH: /data/vault/vault.db
    volumes:
      - ./data:/data
      - ./sources.yaml:/app/sources.yaml:ro
      - ${LOCAL_DOCS_PATH:-/dev/null}:/docs:ro
      - ${CLAUDE_PROJECTS_PATH:-/dev/null}:/transcripts:ro
    # Same reasoning as mcp-server: this one opens untrusted PDFs and
    # transcripts. It needs outbound TCP to qdrant and llama-server, which
    # NET_RAW has nothing to do with.
    cap_drop:
      - NET_RAW
    networks:
      - llm-net
    logging:
      driver: journald
      options:
        tag: "ingestion-worker"

networks:
  llm-net:
    external: true   # Defined in ~/Dev/LLM/docker-compose.yml; start that stack first
  vault-net:
    external: true   # Same -- the isolated open-webui <-> mcp-vault bridge

# No named volumes. Everything lives under ./data as bind mounts so the whole
# stack is one rsync-able directory -- named volumes are root-owned and need
# sudo even to inspect, which makes the eventual server move needlessly hard.
