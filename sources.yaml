# Source manifest for sources OUTSIDE the drop-folder inbox.
#
# The inbox needs no entry here: every directory under data/inbox/ is an
# implicit source whose DIRECTORY NAME IS ITS DOMAIN. Drop a PDF into
# data/inbox/manuals/ and it is indexed as `manuals`, no config edit.
#
# `domain` is REQUIRED on every entry below and must exist in app/domains.py.
# It decides the storage tier -- open (Qdrant, plaintext) or vault (SQLCipher,
# encrypted, sealed). There is deliberately no default: a typo that silently
# became open-tier would write a plaintext vector, and a vector is recoverable
# back to its source text.
#
# Changing EMBED_MODEL or EMBED_DIM after the collection exists requires
# `make rebuild-index`; the fingerprint stored with the vectors enforces it.

sources:
  # Markdown notes authored under ~/Dev, bind-mounted read-only at /docs.
  - id: dev-notes
    type: local
    domain: notes
    path: /docs
    cadence: "0 * * * *"      # hourly
    include:
      - "**/*.md"
    exclude:
      - "**/node_modules/**"
      - "**/.venv/**"
      - "**/site-packages/**"
      - "**/.git/**"

  # Past Claude Code sessions. VAULT tier: transcripts carry pasted secrets,
  # file contents and working paths, so they are encrypted and gated rather
  # than indexed in the clear.
  - id: claude-sessions
    type: transcripts
    domain: transcripts
    path: /transcripts
    cadence: "0 */4 * * *"    # every 4 hours

